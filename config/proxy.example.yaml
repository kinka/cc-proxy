listen:
  host: 0.0.0.0
  port: 25721

upstream:
  base_url: "https://your-openai-compatible-endpoint.example.com"
  api_key: "replace-me"
  api_format: "openai_chat"
  timeout_secs: 600
  prompt_cache_key: "claude-code"
  model_map:
    claude-sonnet-4-20250514: "gpt-5"
    claude-opus-4-20250514: "gpt-5"
    # GF LLM gateway models (all speak the Anthropic protocol upstream too). Short names
    # are aliases; the full `external-*` names map to themselves so they stay listed.
    # Internal deployments (`internal-*`) are deliberately not aliased here.
    qwen3.8-flash: "external-qwen3.8-flash"
    qwen3.8-max: "external-qwen3.8-max"
    glm-5.3-flash: "external-glm-5.3-flash"
    deepseek-v4-flash: "external-deepseek-v4-flash"
    external-qwen3.8-flash: "external-qwen3.8-flash"
    external-qwen3.8-max: "external-qwen3.8-max"
    external-glm-5.3-flash: "external-glm-5.3-flash"
    external-deepseek-v4-flash: "external-deepseek-v4-flash"
  extra_headers: {}
  # Extra top-level fields merged into the upstream request body, for sampling knobs
  # with no Anthropic equivalent. Applies to every model routed through this upstream —
  # give a model its own `providers` entry when the knob should not be shared.
  extra_body: {}
  # extra_body:
  #   repetition_penalty: 1.1

# Optional: Configure multiple different backend connections (providers).
# When a client requests a model via "provider_name/model_name", the proxy will strip 
# "provider_name/" and use that provider's configuration instead of the default upstream.
# For example, using model "mimo/claude-3-5-sonnet" will route to the mimo upstream.
providers:
  mimo:
    base_url: "https://token-plan-cn.xiaomimimo.com/v1"
    api_key: "your-mimo-api-key"
    api_format: "openai_chat"
    timeout_secs: 600
    default_model: "mimo-v2.5-pro"
    extra_headers: {}
  # An upstream that already speaks Anthropic Messages: bodies pass through untouched
  # (model mapping and extra_body still apply), auth is still `Authorization: Bearer`.
  # anthropic-gw:
  #   base_url: "https://anthropic-compatible-gateway.example.com"
  #   api_key: "replace-me"
  #   api_format: "anthropic"
  #   timeout_secs: 600

# Optional: per-request usage ledger + query API (`/usage/daily`, `/usage/sessions`).
# Omit the section to disable both. One JSONL line per request, no bodies, files named
# by Beijing date. The query routes are unauthenticated (counts and caller IDs only).
# usage:
#   dir: "/app/data/usage"
#   retention_days: 90
